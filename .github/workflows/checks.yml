name: Offline backup checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r realtime_relay/requirements.txt
      - run: python -m unittest discover -s realtime_relay -p test_app.py -v
      - run: python -m unittest discover -s scripts -p test_check_backup.py -v
      - run: python scripts/check_backup.py
