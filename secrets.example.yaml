# Copy to secrets.yaml and replace placeholders locally. Never commit secrets.yaml.
wifi_ssid: "YOUR_2_4_GHZ_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"
# Hostname only: do not include https:// or /ws.
jarvis_realtime_host: "YOUR_RELAY_HOSTNAME"
# Must equal the relay's JARVIS_DEVICE_KEY.
jarvis_backend_key: "YOUR_RANDOM_DEVICE_KEY"
# Legacy substitution retained for compatibility; not used by the current relay path.
jarvis_backend_host: "UNUSED_LEGACY_BACKEND_HOST"
